  <script>window.QRADAR_SNAPSHOT=true;window.QRADAR_DATA={"papers": [{"id": "2610.10531", "title": "Efficient Estimation of Logical Sensitivities Through Fault-Counting", "abstract": "Quantum error-correcting circuits are affected by multiple physical noise mechanisms, whose contributions to logical failure must be understood to evaluate code performance and guide improvements in hardware. The individual error budget contributions for an error type $i$ can be characterized by its logical sensitivity $ν_i = \\frac{\\partial p_L}{\\partial p_i}$, which measures the response of the logical error rate $p_L$ to each physical noise parameter $p_i$. Normally, $ν_i$ is measured using linear fits such as finite differences, where $p_L$ is measured at two or more values of $p_i$ to calculate partial derivatives. In this paper, we develop a differentiable estimator to obtain all components of $\\nabla_{\\mathbf p}p_L$ simultaneously from a single Monte Carlo data set at one noise configuration, using information about the underlying fault configurations. In surface code simulations with circuit-level noise, the estimator agrees with conventional finite differences while requiring one to two orders of magnitude fewer shots to achieve the same variance. We apply this technique to quantify error budgets, resolve sensitivities at the individual qubit level, and infer effective code distance. Finally, we incorporate the sensitivities into Newton root finding to locate and trace threshold contours in multidimensional noise models. These results provide an efficient method for extracting and applying logical sensitivity information from standard quantum error correction simulations.", "published": "2026-10-08T04:00:00Z", "updated": "2026-10-08T04:00:00Z", "selected_at": "", "date_basis": "announcement", "version": 1, "authors": ["Winston Fu", "J. Wilson Staples", "Jeff D. Thompson"], "categories": ["quant-ph"], "topics": ["logical_qec"], "url": "https://arxiv.org/abs/2610.10531", "pdf_url": "https://arxiv.org/pdf/2610.10531v1", "analysis": {"summary": "把 physical noise 对 logical failure 的影响定义为灵敏度 ν_i = ∂p_L/∂p_i。作者提出利用已知 fault configurations，从一个噪声参数点的 Monte Carlo 数据同时估计整个梯度；摘要报告在 surface-code 模拟中，相同方差所需 shots 比 finite differences 少一至两个数量级。这是模拟侧的 error-budget 工具，尚不能直接等同于 syndrome-only 实验认证。", "problem": "当电路同时受多种 physical noise 影响时，怎样高效确定每种噪声对 logical error rate 的边际贡献，而不对每个参数反复扫描？", "setting": "固定 QEC 电路与多参数噪声模型 p，目标量是 p_L(p) 及其梯度；输入是 circuit-level Monte Carlo samples，以及每个样本底层的 fault configuration。摘要以 surface-code simulations 为验证场景。", "evidence_level": "abstract", "source_url": "https://arxiv.org/abs/2610.10531", "model": "ChatGPT preview (not API pipeline)", "analyzed_at": "2026-10-09T01:23:39+00:00", "status": "preview", "main_results": ["作者声称从单一噪声配置的一组 Monte Carlo samples，可同时获得 ∇_p p_L 的所有分量，而传统 finite differences 需要在多个 p_i 值上测量 p_L。", "在所述 surface-code circuit-level noise 模拟中，估计器与 finite differences 一致，并在相同方差下减少一至两个数量级的 shots；摘要未给出该收益对码距和噪声率的完整依赖。", "作者将梯度用于分解 error budget、解析 individual-qubit sensitivities、推断 effective code distance，并结合 Newton root finding 追踪多维噪声模型中的 threshold contours。"], "techniques": ["基于底层 fault-counting 信息的 differentiable estimator。", "利用 logical sensitivities 进行 Newton root finding；摘要没有提供估计器公式或方差证明。"], "assumptions": ["必须获得模拟样本的底层 fault configuration，并在明确的参数化噪声模型中定义 p_i。", "摘要中的实证收益来自 surface-code circuit-level noise simulations；其他码和噪声结构的保证需要读全文。"], "limitations": ["分析仅依据摘要；作者的正确性与性能主张未独立验证。", "实际 syndrome record 通常不直接提供每个底层 fault；摘要没有建立仅凭实验 syndrome 数据估计同一梯度的方法。", "摘要未说明 coherent noise、时间相关噪声或 decoder memory 下的适用条件，也未给出一般 sample-complexity bound。"], "relevance": ["直接对应你想建模的 physical-noise features 如何决定 logical performance；ν_i 提供了可操作的数学目标。", "可作为 logical characterization 的模拟基线：明确比较已知 latent faults 与仅有 syndrome / logical-output data 的信息差异。"], "follow_up": ["研究问题：仅观察 syndrome histories 和 logical outputs 时，哪些 ν_i 可识别？最少还需哪些 calibrated controls 或噪声结构假设？", "研究问题：能否估计一组与 logical fidelity 有关的组合灵敏度，避免完整 physical-noise reconstruction，并给出 SPAM 与 model mismatch 的误差界？"], "relevance_score": 94}, "article_path": "articles/2610.10531.html", "sources": []}, {"id": "2610.10471", "title": "Optimized discrete Wigner representations and non-stabilizerness in qubit systems", "abstract": "The apparent absence of a stabilizer-speci?c phase-space description for qubit systems is not fundamental, but arises from ?xing a state-independent discrete Wigner map. Allowing the phase-space representation to adapt to the state through a simple optimization procedure, we prove that every qubit stabilizer state admits an exact delta-function discrete Wigner representation for any ?xed phase-space partition. This optimization can be implemented directly at the level of measurement statistics by selecting maximal probabilities across mutually unbiased bases forming the partition. This construction naturally leads to a non-stabilizer witness de?ned by the optimized value of the Wigner function at the origin. Stabilizer states saturate the universal lower bound of this witness for pure states, whereas a value strictly larger than the bound certi?es non-stabilizerness. Although the witness is not a ?nite-size resource monotone, it becomes sharply concentrated and e?ectively invariant under random Cli?ord transformations in the large-qubit limit, suggesting an asymptotically linear growth law for broad families of non-stabilizer states. Our results restore a meaningful geometric phase-space characterization of qubit stabilizer structure and provide an operational diagnostic of non-stabilizerness.", "published": "2026-10-08T04:00:00Z", "updated": "2026-10-08T04:00:00Z", "selected_at": "", "date_basis": "announcement", "version": 1, "authors": ["A. B. Klimov", "C. Mu\\~noz", "I. Sainz"], "categories": ["quant-ph"], "topics": ["magic_stabilizer", "quantum_learning"], "url": "https://arxiv.org/abs/2610.10471", "pdf_url": "https://arxiv.org/pdf/2610.10471v1", "analysis": {"summary": "作者允许 discrete Wigner representation 随量子态优化，声称每个 qubit stabilizer state 在任意固定 phase-space partition 下都可获得精确 delta-function 表示；以 optimized Wigner origin value 定义 non-stabilizer witness。重要边界是：摘要明确说该 witness 在有限尺寸下不是 resource monotone，而 large-n Clifford 随机化的集中性只是另一类性质。", "problem": "qubit 系统的 state-independent Wigner map 难以统一呈现 stabilizer 结构，是否能用可从测量统计优化的表示构造一个 operational non-stabilizerness diagnostic？", "setting": "qubit states、一个固定 phase-space partition，以及构成该 partition 的 mutually unbiased bases；优化通过选取相应 measurement probabilities 的最大值实现。摘要的 witness lower-bound 饱和陈述针对 pure states。", "evidence_level": "abstract", "source_url": "https://arxiv.org/abs/2610.10471", "model": "ChatGPT preview (not API pipeline)", "analyzed_at": "2026-10-09T01:23:39+00:00", "status": "preview", "main_results": ["作者声称，对任何固定 phase-space partition，每个 qubit stabilizer state 都存在精确 delta-function 的 state-adapted discrete Wigner representation。", "作者以 optimized origin value 定义 witness：pure stabilizer states 饱和 universal lower bound，严格更大的值可认证 non-stabilizerness。", "摘要明确该量在 finite size 不是 resource monotone；作者报告其 large-qubit limit 下高度集中、对 random Clifford transformations 有效不变，并提出广泛 non-stabilizer families 的渐近线性增长迹象。"], "techniques": ["在 phase-space representation 上做 state-dependent optimization。", "直接从 mutually unbiased bases 的 measurement statistics 选择最大概率；集中性结果的具体方法未在摘要中陈述。"], "assumptions": ["明确区分固定 partition 与 state-dependent representation；后者不能直接作为同一个 state-independent map 的性质使用。", "pure-state witness 陈述、mixed-state 情况和有限尺寸 resource-theory 条件需分别核查。"], "limitations": ["分析仅依据摘要；未审阅 witness 的显式表达式、证明和可实验估计的精度要求。", "摘要未给出所需 bases 数量、copies complexity、SPAM robustness 或测量电路资源成本。", "非 monotone witness 不能自动用于证明 magic conversion 或 magic consumption lower bounds。", "原始 RSS 摘要中部分英文字符显示为问号，保留来源原文；需要全文校对。"], "relevance": ["与相关的 stabilizer / magic resource separation 相关，且将 non-stabilizerness 的抽象结构连接到可测量统计。", "适合检验 restricted measurement 下能否高效认证 magic，以及优化本身是否引入隐藏的测量或计算成本。"], "follow_up": ["研究问题：在相关的 restricted Clifford / local-control readout model 下，估计该 witness 的总 shots 和电路深度是多少？", "研究问题：有限尺寸非 monotonicity 的反例对实际 magic certification 有什么影响；small SPAM 与 mixed noise 下是否存在可靠 threshold？"], "relevance_score": 90}, "article_path": "articles/2610.10471.html", "sources": []}, {"id": "2610.09749", "title": "Automated reduction of fault-tolerant circuits", "abstract": "We present an automated method for reducing fault-tolerant circuits through fault-equivalent rewrites. Starting from a known fault-tolerant circuit, the search applies non-reducing enabling rules to expose Bell-pair reductions, each of which removes an ancilla preparation and a CNOT gate. Because every search transition preserves fault equivalence, the resulting circuits inherit the fault-tolerance properties of the input circuit. Candidate circuits are evaluated using circuit-level Monte Carlo simulation. For Shor-style syndrome extraction with the $[[7,1,3]]$ code, our method reduces one syndrome-measurement round from 30 to 18 ancilla preparations and from 54 to 42 CNOT gates. At a physical two-qubit error rate of $p = 10^{-3}$, the optimized circuit lowers the logical error rate by approximately 21% for both logical basis states. The reduction ranges from 13% to 23% over a range of $p$ spanning two orders of magnitude. We also apply the method to Steane-based dynamic syndrome extraction constructed from Goto's verified logical-$\\lvert 0 \\rangle$ preparation, in which the verification qubit serves as a flag. The search selects a circuit using four ancillas and 14 CNOT gates, matching the resource counts of the previous design but with an improved CNOT depth. Under depolarizing idle noise at $3p/10$ the selected circuit lowers the logical error rate by approximately 15% for both logical basis states, and by approximately $10%$ at $p/10$. These results demonstrate that automated fault-equivalent rewriting can identify circuits with lower resource costs or improved logical performance without separately verifying the fault tolerance of every candidate.", "published": "2026-10-08T04:00:00Z", "updated": "2026-10-08T04:00:00Z", "selected_at": "", "date_basis": "announcement", "version": 1, "authors": ["Hyeongjun Jeon", "Jeonghoon Lee", "Taehyun Kim"], "categories": ["quant-ph"], "topics": ["logical_qec", "adaptive_resources"], "url": "https://arxiv.org/abs/2610.09749", "pdf_url": "https://arxiv.org/pdf/2610.09749v1", "analysis": {"summary": "从已知 fault-tolerant circuit 出发，作者用保留 fault equivalence 的 rewrites 自动压缩 syndrome-extraction circuits，再通过 circuit-level Monte Carlo 比较 logical performance。摘要展示了减少 ancilla preparations / CNOTs 的例子，也展示资源计数不变但 CNOT depth 改善的例子；资源减少和 logical error 改善是不同的性能指标。", "problem": "能否在不逐一重新验证每个候选电路的 fault tolerance 的情况下，系统地降低 QEC circuit 的资源成本或改善逻辑性能？", "setting": "输入是已有 fault-tolerance guarantee 的电路；搜索通过 non-reducing enabling rules 暴露 Bell-pair reductions，每次 reduction 移除一次 ancilla preparation 和一个 CNOT。摘要分别讨论 [[7,1,3]] Shor-style syndrome extraction 与 Steane-based dynamic extraction。", "evidence_level": "abstract", "source_url": "https://arxiv.org/abs/2610.09749", "model": "ChatGPT preview (not API pipeline)", "analyzed_at": "2026-10-09T01:23:39+00:00", "status": "preview", "main_results": ["作者声称所有搜索 transitions 保留 fault equivalence，因此输出电路继承输入的 fault-tolerance properties；具体 equivalence 定义需查全文。", "对 [[7,1,3]] Shor-style 电路，一个 syndrome round 的 ancilla preparations 从 30 降至 18，CNOT 从 54 降至 42；two-qubit error p = 10⁻³ 时，两种 logical basis states 的 logical error 均下降约 21%。", "另一 dynamic-extraction 电路使用 4 ancillas 和 14 CNOT，与既有设计资源计数一致但改善 CNOT depth；idle depolarizing rate 为 3p/10 与 p/10 时，摘要分别报告约 15% 与 10% 的 logical error 降幅。"], "techniques": ["搜索 non-reducing enabling rewrites，再进行 Bell-pair reductions。", "用 circuit-level Monte Carlo 评估候选电路，而 fault-tolerance guarantee 来自 rewrite invariance。"], "assumptions": ["输入电路已知 fault tolerant，且所用 rewrite rules 的 fault equivalence 适用于采用的 fault model。", "logical-error 数字来自所述模拟噪声配置；dynamic-extraction 数字显式依赖 idle depolarizing noise rate。"], "limitations": ["分析仅依据摘要；未核查 fault-equivalence proof、搜索完备性或 Monte Carlo uncertainty。", "ancilla preparations 数量与同时占用的 ancilla space 不是同一个资源；首个例子没有直接给出峰值 ancilla 数。", "两种 logical basis states 的错误率改善不等同于一般 logical process fidelity 的改善；摘要没有提供 SPAM-robust 实验认证。"], "relevance": ["为相关的 depth / ancilla tradeoffs 提供具体 QEC task；可把 rewrite-preserved 属性与真正随噪声模型变化的 logical performance 分开。", "对应 logical benchmarking 的关键 formulation：固定完整 extraction / recovery gadget，再明确到底估计 logical failure、state fidelity 还是 process fidelity。"], "follow_up": ["研究问题：fault-equivalence constraints 下是否有可证明的 depth–ancilla–gate-count lower bounds，而不只依赖搜索结果？", "研究问题：对优化后 gadget，最少 logical preparations / readouts 与 syndrome data 能否给出包含 coherent noise 和 SPAM 的 process-fidelity bounds？"], "relevance_score": 88}, "article_path": "articles/2610.09749.html", "sources": []}, {"id": "2610.09341", "title": "Building codes with transversal CCZ using projective geometry and SAT solvers", "abstract": "We construct CSS codes with three logical qubits whose logical CCZ gate is implemented by transversal physical $T/T^{\\dagger}$ gates and whose distance is at least $3$. These codes start with $8$-divisible $X$-stabilizers defined by projective geometry, which guarantees $d_Z\\geq 3$. A SAT solver then finds three $X$-logical operators compatible with the transversal CCZ. We build codes at thirteen block lengths from $n=48$ to $n=496$, with $d_Z=3$ or $4$, and illustrate the method with the $[[48,3,3]]$ code $Q_{48}$. Additionally, we prove that no CSS code with three logical qubits, $Z$-distance at least $3$, and a quasi-transversal CCZ gate (transversal $T$ with a diagonal Clifford correction) exists below $n=39$. The $[[47,3,3]]$ code of Jacinto et al. serves as an upper bound, leaving $39\\leq n\\leq46$ open.", "published": "2026-10-08T04:00:00Z", "updated": "2026-10-08T04:00:00Z", "selected_at": "", "date_basis": "announcement", "version": 1, "authors": ["Bohan Lu", "Kenneth R. Brown"], "categories": ["quant-ph", "cs.IT", "math.IT"], "topics": ["logical_qec", "magic_stabilizer", "adaptive_resources"], "url": "https://arxiv.org/abs/2610.09341", "pdf_url": "https://arxiv.org/pdf/2610.09341v1", "analysis": {"summary": "作者用 projective geometry 与 SAT search 构造编码 3 个 logical qubits、distance 至少 3 的 CSS codes，使 logical CCZ 由 transversal physical T / T† 实现。摘要给出 n = 48 至 496 的 13 个 block lengths，并声称 quasi-transversal CCZ 的特定 CSS family 在 n \u003c 39 不可能；既有 [[47,3,3]] 上界仍留下 39–46 的空档。", "problem": "为容错 non-Clifford operation 配置专门的 stabilizer code 时，需要多少 physical qubits？几何结构和自动搜索能否同时产生构造并给出严格的 block-length 下界？", "setting": "CSS code 编码三个 logical qubits。8-divisible X-stabilizers 来自 projective geometry 并保证 d_Z ≥ 3；SAT solver 寻找与 transversal CCZ 相容的三个 X-logical operators。下界针对 Z-distance 至少 3、transversal T 加 diagonal Clifford correction 的 quasi-transversal CCZ。", "evidence_level": "abstract", "source_url": "https://arxiv.org/abs/2610.09341", "model": "ChatGPT preview (not API pipeline)", "analyzed_at": "2026-10-09T01:23:39+00:00", "status": "preview", "main_results": ["作者报告在 n = 48 至 496 的 13 个 block lengths 上构造 distance 至少 3 的 codes，其中 d_Z 为 3 或 4，并以 [[48,3,3]] Q_48 为例。", "作者声称，具有三个 logical qubits、d_Z ≥ 3 和所定义 quasi-transversal CCZ 的 CSS code 在 n \u003c 39 时不存在。", "摘要引用既有 [[47,3,3]] code 作为上界，因此最短 block length 的未解决区间是 39 ≤ n ≤ 46。"], "techniques": ["使用 projective geometry 构造 8-divisible X-stabilizers。", "用 SAT solver 寻找 logical operators；下界的证明方法在摘要中未说明。"], "assumptions": ["必须区分构造的 full distance 至少 3 与下界假设的 Z-distance 至少 3。", "下界限定于所述 CSS / quasi-transversal implementation model，不能推广为所有 CCZ implementation 的 qubit 或 magic 成本下界。"], "limitations": ["分析仅依据摘要；未独立核查 code 参数、divisibility 条件或 block-length lower bound。", "摘要没有给出 full logical-noise performance、threshold、syndrome-extraction depth 或 magic-state factory 成本。", "transversal physical T/T† 不代表 physical non-Clifford resource 无成本，也不能从 block length 直接推出整个 fault-tolerant computation 的 magic budget。"], "relevance": ["将 stabilizer structure、non-Clifford operation 与 QEC resource costs 结合，贴合该领域关心的 magic / ancilla / depth tradeoffs。", "下界和构造之间的明确空档适合作为科学问题筛选范例，比仅比较 heuristic performance 更有针对性。"], "follow_up": ["研究问题：加入 extraction / recovery 电路后，这些 codes 的完整 logical CCZ gadget 在 depth、physical T count、ancilla 与 logical infidelity 之间有何 tradeoff？", "研究问题：能否用 bounded-error logical controls 认证此类 CCZ gadget，并区分 syndrome-visible faults 与 invisible logical faults？"], "relevance_score": 86}, "article_path": "articles/2610.09341.html", "sources": []}, {"id": "2610.08890", "title": "Quantum Readout Complexity for Normalized Linear Functionals", "abstract": "Quantum numerical algorithms often encode a positive solution $q$ in the amplitudes of a quantum state, while the required scientific output is a normalized linear functional of $q$. Basis measurements produce probabilities determined by squared solution values, while the functional uses the solution values themselves. We study the complexity of this output-interface problem for $F_φ(q)=\\intφq\\,\\mathrm dν/\\int q\\,\\mathrm dν$ and identify a target-dependent susceptibility $χ_φ$ that governs the amount of copies of the solution state needed. For a fixed positive reference state and a neighborhood around it, the optimal number of unknown-state copies is $Θ\\!\\left(χ_0\\varepsilon^{-2}\\log(1/β)\\right)$, where $\\varepsilon$ is the absolute error tolerance and $β$ is the allowed failure probability. We show that two fixed single-copy measurements attain the same rate. We then analyze how this baseline changes when the interface retains classical information, uses adaptive allocation, supplies coherent access, or restricts the allowed solution family. Therefore $χ_φ$ quantifies a central cost of using a solution encoded in an $L^2$-normalized quantum state to estimate an $L^1$-normalized linear observable.", "published": "2026-10-08T04:00:00Z", "updated": "2026-10-08T04:00:00Z", "selected_at": "", "date_basis": "announcement", "version": 1, "authors": ["Roi Vence-Nogueira"], "categories": ["quant-ph"], "topics": ["quantum_learning", "data_hiding", "adaptive_resources"], "url": "https://arxiv.org/abs/2610.08890", "pdf_url": "https://arxiv.org/pdf/2610.08890v1", "analysis": {"summary": "研究 quantum numerical algorithms 的读出接口：振幅编码的正函数 q 产生与 q² 有关的测量概率，但目标 F_φ(q) = ∫φq dν / ∫q dν 对 q 是线性的。作者在固定正参考态附近给出由 susceptibility χ_0 控制的最优 copies 成本 Θ(χ_0 ε⁻² log(1/β))，并声称两个固定 single-copy measurements 足以达到该量级。", "problem": "量子算法输出一个 L²-normalized amplitude-encoded state 后，提取 L¹-normalized 科学观测量真正需要多少 quantum-state copies？测量和 classical / coherent access 如何改变这一成本？", "setting": "未知正解 q 由 quantum-state amplitudes 编码；目标是以 absolute error ε、failure probability β 估计 F_φ(q)。最优成本结论限定于一个固定 positive reference state 及其邻域，而不是任意全局解族。", "evidence_level": "abstract", "source_url": "https://arxiv.org/abs/2610.08890", "model": "ChatGPT preview (not API pipeline)", "analyzed_at": "2026-10-09T01:23:39+00:00", "status": "preview", "main_results": ["作者引入 target-dependent susceptibility χ_φ 来量化读出 normalized linear functional 所需的 copies；摘要中的局部最优界写作 Θ(χ_0 ε⁻² log(1/β))。", "作者声称两个固定 single-copy measurements 可达到同一量级，因此该局部 baseline 不必依赖 collective multi-copy readout。", "论文进一步比较保留 classical information、adaptive allocation、coherent access 或限制 solution family 后 baseline 如何变化；摘要没有给出这些扩展的定量界。"], "techniques": ["通过 target-dependent susceptibility 描述读出成本，并比较不同数据接口。", "构造两个固定 single-copy measurements；具体 POVM、可实现成本和 lower-bound 方法在摘要中未说明。"], "assumptions": ["q 为正，且主 copies 结论在固定 positive reference state 的某个邻域内成立。", "ε 表示目标 functional 的 absolute error，β 表示 allowed failure probability；copies 与 coherent-oracle calls 应分别计数。"], "limitations": ["分析仅依据摘要；未核查 susceptibility 的定义、局部邻域条件或 lower-bound proof。", "最优 copies 界没有自动计入制备每份 solution state 的成本；测量电路深度与 ancilla 成本也未在摘要中给出。", "摘要只说明研究了 coherent access / side information 的变化，不能据此宣称这些资源已带来特定指数优势。"], "relevance": ["贴近相关的 quantum-data access 研究：先固定 task、accuracy 与 access model，再比较不同资源的 operational value。", "两个 fixed single-copy measurements 的结论可作为判断更高 design order、adaptive measurement 或 quantum memory 是否改善总 sample complexity 的比较基线。"], "follow_up": ["研究问题：哪些 classical side information 真正改变 χ 或最优 copies 界？能否将其到达测量前后的顺序分开建模？", "研究问题：加入 preparation noise、SPAM 与 locality 限制后，two-measurement 最优性是否保留，还是出现新的 depth–copies tradeoff？"], "relevance_score": 92}, "article_path": "articles/2610.08890.html", "sources": []}], "profile_title": "Quantum arXiv Digest", "is_demo": true, "last_successful_run": null, "last_collection_run": null, "last_analysis_run": null, "last_run": {"fetched": 145, "analyzed": 0, "selected": 5, "pending": 0}, "site_url": "http://localhost:8000/", "topic_labels": {"adaptive_resources": "Adaptive circuits / resources", "data_hiding": "Quantum data / information access", "logical_qec": "Logical QEC", "magic_stabilizer": "Magic / stabilizer", "quantum_learning": "Quantum learning / certification"}, "topic_feeds": {"adaptive_resources": "feeds/adaptive_resources.xml", "data_hiding": "feeds/data_hiding.xml", "logical_qec": "feeds/logical_qec.xml", "magic_stabilizer": "feeds/magic_stabilizer.xml", "quantum_learning": "feeds/quantum_learning.xml"}};</script>

<body>
  <a class="skip-link" href="#paper-list">跳到文章列表</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">Quantum arXiv Digest</a>
      <nav aria-label="主导航"><a id="current-feed" href="./feed.xml">RSS</a><button type="button" class="text-button" id="copy-feed">复制 RSS</button></nav>
    </div>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title" lang="en">Quantum papers.</h1>
      <p lang="en">Original abstracts. Chinese AI technical reports.</p>
    </section>
    <p class="notice" id="demo-notice" hidden>真实论文阅读预览 · 非自动更新</p>
    <form class="toolbar" id="filter-form" role="search">
      <label class="search-wrap" for="search"><span class="sr-only">搜索标题、作者或技术关键词</span><input id="search" type="search" placeholder="搜索论文 / Search papers" autocomplete="off"></label>
      <label class="select-wrap"><span class="sr-only">研究主题</span><select id="topic-filter"><option value="">全部主题</option></select></label>
    </form>
    <div class="list-caption"><p id="result-caption" role="status" aria-live="polite">正在读取文章…</p><p class="copy-status" id="copy-status" role="status"></p></div>
    <section class="paper-list" id="paper-list" tabindex="-1" aria-label="论文文章"></section>
    <div class="empty-state" id="empty-state" hidden><h2>暂无文章</h2><p id="empty-message">请稍后刷新。</p><button type="button" class="reset-button" id="reset-filters">清除筛选</button></div>
    <details class="local-workbench" id="local-workbench" hidden>
      <summary>本机更新 <span id="pending-count">0</span> 篇待分析</summary>
      <div class="local-actions"><button class="local-button" id="collect-papers" type="button">收集候选</button><button class="local-button" id="export-request" type="button">导出待分析材料</button><button class="local-button" id="import-analysis" type="button">导入 ChatGPT 分析</button><input id="analysis-file" type="file" accept=".json,application/json" hidden></div>
      <p class="local-status" id="local-status" role="status" aria-live="polite"></p>
      <p class="local-notes">将导出的材料交给 ChatGPT，导入完成的分析后更新文章。<a id="local-feed-link" href="./feed.xml">本机 RSS</a> 需保持本地服务运行。</p>

  <footer class="site-footer shell"><p>AI 阅读报告 · 分析依据逐篇标注</p><p id="updated-at"></p></footer>
  <script>"use strict";

(() => {
  const $ = (id) => document.getElementById(id);
  const node = (tag, text, className) => {
    const element = document.createElement(tag);
    if (text !== undefined && text !== null) element.textContent = String(text);
    if (className) element.className = className;
    return element;
  };
  const strings = (value) => Array.isArray(value) ? value.filter((v) => typeof v === "string") : [];
  const safeUrl = (value) => {
    try {
      const url = new URL(value);
      return url.protocol === "https:" && !url.username && !url.password ? url.href : "";
    } catch (_) { return ""; }
  };
  const externalLink = (text, url) => {
    const link = node("a", text);
    const valid = safeUrl(url);
    if (valid) { link.href = valid; link.target = "_blank"; link.rel = "noopener noreferrer"; }
    return link;
  };
  const articlePath = (value) => /^articles\/(?:[0-9]{4}\.[0-9]{4,5}|paper-[a-f0-9]{16})\.html$/.test(value || "") ? "./" + value : "";
  const date = (value, detailed = false) => {
    const parsed = new Date(value);
    if (!value || Number.isNaN(parsed.getTime())) return "";
    const options = {timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"};
    if (detailed) Object.assign(options, {hour: "2-digit", minute: "2-digit", hour12: false});
    return new Intl.DateTimeFormat("zh-CN", options).format(parsed);
  };
  const state = {data: null, topic: "", query: "", eventsBound: false, localEventsBound: false, local: null, busy: false};

  async function localRequest(path, payload) {
    const options = {cache: "no-store", credentials: "same-origin"};
    if (payload !== undefined) {
      options.method = "POST";
      options.headers = {"Content-Type": "application/json"};
      options.body = JSON.stringify(payload);
    }
    let response;
    try { response = await fetch(path, options); }
    catch (_) { throw new Error("无法连接本地服务，请确认启动窗口仍在运行。"); }
    let value;
    try { value = await response.json(); }
    catch (_) { throw new Error("本地服务返回了无法读取的响应，请确认服务仍在运行。"); }
    if (!value || typeof value !== "object") throw new Error("本地服务返回了无法读取的响应。");
    if (!response.ok || value.ok === false) throw new Error(value.error || "本地操作未完成，请稍后重试。");
    return value;
  }

  function localMessage(text, error = false) {
    $("local-status").textContent = text;
    $("local-status").classList.toggle("error", error);
  }

  function localControls() {
    for (const id of ["collect-papers", "import-analysis", "analysis-file"]) $(id).disabled = state.busy;
    $("export-request").disabled = state.busy || !state.local || state.local.pending === 0;
    $("local-workbench").setAttribute("aria-busy", String(state.busy));
  }

  async function refreshLocalStatus() {
    const status = await localRequest("/api/status");
    if (!status || status.local !== true || !Number.isInteger(status.pending) || status.pending < 0) throw new Error("无法确认本地档案状态。");
    state.local = status;
    $("pending-count").textContent = status.pending;
    localControls();
    return status;
  }

  async function reloadArchive() {
    const response = await fetch("./papers.json", {cache: "no-store"});
    if (!response.ok) throw new Error("结果已保存，但阅读档案读取失败，请刷新页面。");
    init(await response.json());
    return refreshLocalStatus();
  }

  async function localAction(message, action) {
    if (state.busy) return;
    state.busy = true;
    localControls();
    localMessage(message);
    try { await action(); }
    catch (error) { localMessage(error instanceof TypeError ? "无法完成本地操作，请确认服务仍在运行，然后重试。" : String(error.message || error).slice(0, 650), true); }
    finally { state.busy = false; localControls(); }
  }

  async function setupLocal() {
    if (location.protocol !== "http:" || location.hostname !== "127.0.0.1") return;
    try { await refreshLocalStatus(); }
    catch (_) { return; } // Static previews have no local operations API.
    $("local-workbench").hidden = false;
    if (state.localEventsBound) return;
    state.localEventsBound = true;
    $("local-feed-link").href = "/feed.xml";
    $("local-feed-link").textContent = location.origin + "/feed.xml";
    localMessage(state.local.pending ? "已有 " + state.local.pending + " 篇候选待分析，可以先导出材料。" : "先收集候选，再导出材料交给 ChatGPT 分析。");
    $("collect-papers").addEventListener("click", () => localAction("正在从 arXiv 收集候选… 完成后会更新待分析数量。", async () => {
      const result = await localRequest("/api/collect", {});
      const status = await reloadArchive();
      const fetched = result.last_run && result.last_run.fetched;
      localMessage((Number.isInteger(fetched) ? "已抓取 " + fetched + " 篇论文；" : "候选收集完成；") + "当前 " + status.pending + " 篇待分析。收集不会自动生成技术摘要。");
    }));
    $("export-request").addEventListener("click", () => localAction("正在整理待分析材料…", async () => {
      const response = await fetch("/api/analysis-request", {cache: "no-store", credentials: "same-origin"});
      if (!response.ok) {
        let failure = {};
        try { failure = await response.json(); } catch (_) { /* Use the message below. */ }
        throw new Error(failure.error || "待分析材料导出失败。");
      }
      const content = await response.text();
      const blobUrl = URL.createObjectURL(new Blob([content], {type: "text/plain;charset=utf-8"}));
      const link = node("a");
      link.href = blobUrl;
      link.download = "qradar-analysis-request.txt";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      localMessage("材料已导出。将文件交给 ChatGPT，完成分析后下载返回的 JSON，再在这里导入。");
    }));
    $("import-analysis").addEventListener("click", () => $("analysis-file").click());
    $("analysis-file").addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      localAction("正在检查并导入分析结果…", async () => {
        if (file.size > 8 * 1024 * 1024) throw new Error("分析文件超过 8 MB，请分成较小批次后导入。");
        let batch;
        try { batch = JSON.parse(await file.text()); }
        catch (_) { throw new Error("文件不是有效的 JSON。请导入 ChatGPT 返回的完整 JSON 文件。"); }
        if (!batch || !Array.isArray(batch.analyses) || !batch.analyses.length) throw new Error("JSON 需要包含非空的 analyses 数组。请让 ChatGPT 按导出材料中的格式返回结果。");
        const result = await localRequest("/api/import-analysis", batch);
        const status = await reloadArchive();
        const imported = result.last_analysis_batch || {};
        localMessage("已导入 " + (imported.analyzed || 0) + " 篇分析，新增 " + (imported.selected || 0) + " 篇精选；当前 " + status.pending + " 篇待分析。网页和 RSS 已更新。");
      }).finally(() => { $("analysis-file").value = ""; });
    });
  }

  function scopeLabel(analysis) {
    return analysis.evidence_level === "full_text_excerpt" ? "依据论文正文节选" : analysis.evidence_level === "abstract" ? "依据论文摘要" : "依据已标注来源";
  }

  function section(label, text) {
    const block = node("section", undefined, "report-section");
    block.append(node("h2", label));
    if (Array.isArray(text)) {
      const list = node("ul");
      for (const value of text) list.append(node("li", value));
      block.append(list);
    } else {
      for (const paragraph of String(text).split(/\n\s*\n/)) {
        if (paragraph.trim()) block.append(node("p", paragraph));
      }
    }
    return block;
  }

  function topicName(topic) { return state.data.topic_labels[topic] || topic; }

  function snapshotReport(paper) {
    const analysis = paper.analysis || {};
    const details = node("details", undefined, "snapshot-report");
    details.id = "analysis-" + paper.id;
    details.append(node("summary", "AI 中文技术阅读报告"));
    const content = node("div", undefined, "report");
    content.append(node("p", scopeLabel(analysis), "paper-meta"));
    for (const [key, label] of [
      ["summary", "这篇论文做了什么"], ["problem", "研究问题与动机"],
      ["setting", "模型、任务与评价指标"], ["main_results", "主要贡献与结果"],
      ["techniques", "核心技术路线"], ["assumptions", "结论成立的条件"],
      ["limitations", "局限与证据边界"], ["relevance", "相关研究与意义"],
      ["follow_up", "进一步阅读与开放问题"],
    ]) {
      const value = Array.isArray(analysis[key]) ? strings(analysis[key]) : analysis[key];
      if (value && (!Array.isArray(value) || value.length)) content.append(section(label, value));
    }
    details.append(content);
    return details;
  }

  function card(paper) {
    const article = node("article", undefined, "paper-card");
    article.id = "paper-" + paper.id;
    const title = node("h2", undefined, "paper-title");
    title.id = "title-" + paper.id;
    title.lang = "en";
    article.setAttribute("aria-labelledby", title.id);
    const report = window.QRADAR_SNAPSHOT ? snapshotReport(paper) : null;
    const reportLink = (text) => {
      const link = node("a", text);
      if (report) {
        link.href = "#" + encodeURIComponent(report.id);
        link.addEventListener("click", () => { report.open = true; });
      } else {
        const path = articlePath(paper.article_path);
        if (path) link.href = path;
      }
      return link;
    };
    title.append(reportLink(paper.title || "Untitled paper"));
    const metadata = node("p", "arXiv:" + paper.id + " · " + date(paper.published), "paper-meta");
    metadata.lang = "en";
    const authors = strings(paper.authors);
    const authorText = authors.length > 4 ? authors.slice(0, 4).join(", ") + ", et al." : authors.join(", ");
    const authorLine = node("p", authorText, "authors");
    authorLine.lang = "en";
    authorLine.title = authors.join(", ");
    const abstract = node("p", paper.abstract || "The original abstract is not available in this entry.", "abstract");
    abstract.lang = "en";
    const links = node("div", undefined, "paper-links");
    if (safeUrl(paper.url)) links.append(externalLink("arXiv ↗", paper.url));
    links.append(reportLink("阅读 AI 中文报告 →"));
    article.append(metadata, title, authorLine, abstract, links);
    if (report) article.append(report);
    return article;
  }

  function searchable(paper) {
    const analysis = paper.analysis || {};
    return [paper.title, paper.abstract, ...strings(paper.authors), ...strings(paper.topics).map(topicName), analysis.summary, analysis.problem, analysis.setting,
      ...["main_results", "techniques", "assumptions", "limitations", "relevance", "follow_up"].flatMap((key) => strings(analysis[key]))].join(" ").toLocaleLowerCase();
  }

  function updateTopics() {
    const selector = $("topic-filter");
    selector.replaceChildren();
    for (const topic of ["", ...Object.keys(state.data.topic_feeds)]) {
      const option = node("option", topic ? topicName(topic) : "全部主题");
      option.value = topic;
      selector.append(option);
    }
    selector.value = state.topic;
    const path = state.topic ? state.data.topic_feeds[state.topic] : "feed.xml";
    $("current-feed").href = "./" + path;
    $("current-feed").textContent = state.topic ? "主题 RSS" : "RSS";
  }

  function render() {
    updateTopics();
    const papers = state.data.papers.filter((paper) => (!state.topic || strings(paper.topics).includes(state.topic)) && (!state.query || searchable(paper).includes(state.query.toLocaleLowerCase())));
    papers.sort((left, right) => (Date.parse(right.published) || 0) - (Date.parse(left.published) || 0) || String(left.id).localeCompare(String(right.id)));
    $("result-caption").textContent = papers.length + " articles" + (state.topic ? " · " + topicName(state.topic) : "");
    $("paper-list").replaceChildren(...papers.map(card));
    $("empty-state").hidden = papers.length > 0;
    $("reset-filters").hidden = state.data.papers.length === 0;
    $("empty-message").textContent = state.data.papers.length ? "尝试其他关键词或主题。" : "完成分析的文章将在这里发布。";
  }

  function init(data) {
    if (!data || !Array.isArray(data.papers)) throw new Error("invalid data");
    state.data = data;
    data.topic_labels = data.topic_labels || {};
    data.topic_feeds = data.topic_feeds || {};
    $("demo-notice").hidden = !data.is_demo;
    $("updated-at").textContent = data.last_analysis_run ? "更新于 " + date(data.last_analysis_run, true) + " 北京时间" : "";
    render();
    if (state.eventsBound) return;
    state.eventsBound = true;
    $("search").addEventListener("input", (event) => { state.query = event.target.value.trim(); render(); });
    $("topic-filter").addEventListener("change", (event) => { state.topic = event.target.value; render(); });
    $("filter-form").addEventListener("submit", (event) => event.preventDefault());
    $("reset-filters").addEventListener("click", () => {
      state.topic = ""; state.query = ""; $("search").value = ""; render();
    });
    $("copy-feed").addEventListener("click", async () => {
      const path = state.topic ? state.data.topic_feeds[state.topic] : "feed.xml";
      const url = new URL(path, state.local ? location.origin + "/" : data.site_url).href;
      try {
        await navigator.clipboard.writeText(url);
        $("copy-status").textContent = "RSS 链接已复制";
      } catch (_) { $("copy-status").textContent = url; }
    });
    if (location.hash.startsWith("#paper-")) {
      try {
        const selected = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (selected) selected.scrollIntoView({block: "start"});
      } catch (_) { /* Ignore malformed fragments. */ }
    }
    setupLocal();
  }

  Promise.resolve(window.QRADAR_DATA || fetch("./papers.json", {cache: "no-cache"}).then((response) => {
    if (!response.ok) throw new Error("data unavailable");
    return response.json();
  })).then(init).catch(() => {
    $("result-caption").textContent = "读取失败，请稍后刷新。";
    $("empty-state").hidden = false;
    $("empty-message").textContent = location.protocol === "file:" ? "请通过本地服务打开，或使用 snapshot.html 便携预览。" : "RSS 仍可打开已发布的中文报告。";
    $("reset-filters").hidden = true;
  });
})();
</script>
</body>
</html>
